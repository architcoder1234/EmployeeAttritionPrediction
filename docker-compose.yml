version: '3.8'

services:
  streamlit-app:
    build: .
    container_name: attrition_streamlit_app
    ports:
      - "8501:8501"
    restart: unless-stopped
    command: streamlit run Streamlit_App/app.py --server.port=8501 --server.address=0.0.0.0

  fastapi-backend:
    build: .
    container_name: attrition_api_backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: uvicorn Advanced_Web_App.backend.main:app --host 0.0.0.0 --port 8000
